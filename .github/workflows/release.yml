name: Build & Release Parallax Wallpaper DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish DMG
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Build Release macOS App
        run: |
          xcodebuild -project parallexWall.xcodeproj -scheme parallexWall -configuration Release -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build

      - name: Package DMG Artifact
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release -name "parallexWall.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: parallexWall.app not found!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          hdiutil create -volname "Parallax Wallpaper" -srcfolder dmg_staging -ov -format UDZO ParallaxWallpaper.dmg

      - name: Generate Dynamic Release Notes Body
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "${{ github.ref_name }}" | head -n 1 || echo "")
          echo "Previous release tag detected: '$PREV_TAG'"
          
          cat << 'EOF' > release_notes.md
## What's New in Parallax Wallpaper

### Key Features & Enhancements
* **AirPods Spatial Motion & Mac Accelerometer**: Dual motion tracking supporting both MacBook SPU accelerometer (`IOKit`) and AirPods Head Motion (`CMHeadphoneMotionManager`).
* **Apple-Style Control Center UI**: Glassmorphic bottom navigation pill and single-block motion source slider switch (**Mac** vs **AirPods**).
* **Multi-Layer 3D Depth Engine**: Stack $N$ PNG image layers with auto-depth distribution and independent opacity & depth multipliers.
* **Interactive Canvas Drag & Scaling**: Drag any layer directly on preview canvas to position, or drag the top-right blue handle dot to scale layer zoom ($0.15\times$ to $2.5\times$).
* **Inverted Motion Smoothing**: Intuitive slider control ($0.0$ Raw/Direct to $1.0$ Ultra Smooth).
* **Draft Preview & Wallpaper Apply**: Live draft preview before applying changes directly to macOS desktop background.

### macOS Security & Gatekeeper Note
If macOS displays a warning when launching the app, run the following command in Terminal:
```bash
xattr -dr com.apple.quarantine "/Applications/parallexWall.app"
```

### Recent Commits
EOF
          
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" >> release_notes.md
          else
            git log -n 15 --pretty=format:"* %s (%h)" >> release_notes.md
          fi
          echo "" >> release_notes.md
          
          echo "--- GENERATED RELEASE NOTES ---"
          cat release_notes.md

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxWallpaper-DMG
          path: ParallaxWallpaper.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ParallaxWallpaper.dmg
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
