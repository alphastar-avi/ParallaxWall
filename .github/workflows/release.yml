name: Build & Release Parallax Wallpaper DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish DMG
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Build Release macOS App
        run: |
          xcodebuild -project parallexWall.xcodeproj -scheme parallexWall -configuration Release -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build

      - name: Package DMG Artifact
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release -name "parallexWall.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: parallexWall.app not found!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          hdiutil create -volname "Parallax Wallpaper" -srcfolder dmg_staging -ov -format UDZO ParallaxWallpaper.dmg

      - name: Generate Dynamic Release Notes Body
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "${{ github.ref_name }}" | head -n 1 || echo "")
          echo "Previous release tag detected: '$PREV_TAG'"
          
          printf "## Release %%s\n\n### What's Changed\n" "${{ github.ref_name }}" > release_notes.md
          
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" >> release_notes.md
          else
            git log -n 20 --pretty=format:"* %s (%h)" >> release_notes.md
          fi
          
          printf "\n\n---\n\n### macOS Security & Gatekeeper Note\nIf macOS displays a security warning when launching the app (*\"App is damaged and can't be opened\"*), run this command in **Terminal**:\n\`\`\`bash\nxattr -dr com.apple.quarantine \"/Applications/parallexWall.app\"\n\`\`\`\n" >> release_notes.md
          
          echo "--- GENERATED DYNAMIC RELEASE NOTES ---"
          cat release_notes.md

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxWallpaper-DMG
          path: ParallaxWallpaper.dmg

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Publishing official release for tag ${{ github.ref_name }}..."
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag 2>/dev/null || true
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          sleep 2
          gh release create "${{ github.ref_name }}" ParallaxWallpaper.dmg \
            --title "Release ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
